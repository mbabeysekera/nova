services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    volumes:
      - ..:/workspaces/nova:cached
    command: >
      /bin/sh -c "dockerd --iptables=false --storage-driver=vfs > /tmp/dockerd.log 2>&1 &
      until docker info >/dev/null 2>&1; do
        echo 'waiting for docker daemon...';
        sleep 2;
      done;
      exec sleep infinity"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nova?schema=public

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nova
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nova"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
